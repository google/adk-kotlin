# Builds and tests the Kotlin ADK with Gradle on the supported JDKs.
name: validation

on:
  pull_request:
    branches:
      - main
  # Also build on `main` pushes: PR runs only read the cache, so these seed it.
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Cancel superseded runs on PR branches, but let `main` runs finish so
  # post-merge verification and cache seeding are never aborted mid-run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only: no step in this workflow writes to the repository.
permissions:
  contents: read

jobs:
  build-modules:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        java-version: ["17", "21", "25"]

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Only local git commands run later; don't leave the token on disk.
          persist-credentials: false

      # JDK 21 is required by the litertlm/examples module toolchains (the
      # upstream litert-lm artifacts are compiled for Java 21). The matrix JDK
      # is used for the rest of the project; the last version listed becomes
      # JAVA_HOME, so Gradle starts up on the matrix JDK.
      - name: Set up JDK 21 and JDK ${{ matrix.java-version }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: |
            21
            ${{ matrix.java-version }}

      # The `com.android.library` subprojects need an SDK to resolve
      # compileSdk / minSdk. Installed explicitly to pin the components.
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # Keep these in sync with the values in build.gradle.kts
          # (androidCompileSdk / androidMinSdk).
          packages: "platforms;android-37.0 build-tools;37.0.0"

      # `basic` (MIT) provider: one entry per build-file hash, for all JDKs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          # Only the JDK 17 leg on `main` saves the cache: it also runs Dokka.
          cache-read-only: ${{ github.ref != 'refs/heads/main' || matrix.java-version != '17' }}

      - name: Build and test (Java ${{ matrix.java-version }})
        # GRADLE_OPTS sizes only the Gradle client JVM, not the build daemon.
        # --no-build-cache: secret-bearing outputs must stay out of the cache.
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g -Dorg.gradle.daemon=false"
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_DISABLE_IT: ${{ vars.FIREBASE_DISABLE_IT }}
          FIREBASE_MODEL_NAME: ${{ vars.FIREBASE_MODEL_NAME }}
        run: |
          ./gradlew \
            -PjdkVersion=${{ matrix.java-version }} \
            --no-build-cache \
            --no-daemon \
            --stacktrace \
            build

      - name: Generate API docs (Dokka)
        # Validates that KDoc `[references]` resolve. Run as a separate Gradle
        # invocation from `build` so the two never run concurrently, capping
        # peak memory at max(build, dokka) on the runner. Docs output is
        # JDK-independent, so generate once. Keep the pinned JDK below in sync
        # with the matrix's lowest entry and with `cache-read-only` above, so
        # the step keeps running if the matrix changes. No FIREBASE_* env:
        # dokkaGenerate reads none of it (the Firebase config is only consumed
        # by tests and by assemble/install).
        if: matrix.java-version == '17'
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g -Dorg.gradle.daemon=false"
        run: |
          ./gradlew \
            -PjdkVersion=${{ matrix.java-version }} \
            --no-build-cache \
            --no-daemon \
            --stacktrace \
            dokkaGenerate

      - name: Detect wrongly formatted files
        run: git status && git diff --exit-code
