# Fails the check if a pull request has more than one commit, prompting authors
# to squash before merging (keeps a clean conventional-commit history).
name: 'PR Commit Check'

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  check-commit-count:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch all history so commits can be counted.
          fetch-depth: 0
          # Only local git commands run later; don't leave the token on disk.
          persist-credentials: false

      - name: Count Commits
        id: count_commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          count=$(git rev-list --count "${BASE_SHA}..${HEAD_SHA}")
          echo "commit_count=$count" >> $GITHUB_OUTPUT

      - name: Check Commit Count
        if: steps.count_commits.outputs.commit_count > 1
        env:
          COMMIT_COUNT: ${{ steps.count_commits.outputs.commit_count }}
        run: |
          echo "This pull request has ${COMMIT_COUNT} commits."
          echo "Please squash them into a single commit before merging:"
          echo "  git rebase -i HEAD~${COMMIT_COUNT} && git push --force"
          exit 1

      - name: Success
        if: steps.count_commits.outputs.commit_count <= 1
        run: echo "This pull request has a single commit."
